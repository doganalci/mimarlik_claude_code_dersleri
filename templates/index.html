<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metin & Resim Önerisi</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      header {
        padding: 24px;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      @media (max-width: 800px) {
        main { grid-template-columns: 1fr; }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 420px;
      }
      .panel h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      textarea {
        flex: 1;
        width: 100%;
        background: #0b1220;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        font-size: 15px;
        font-family: inherit;
        resize: vertical;
        min-height: 280px;
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      button {
        background: var(--accent);
        color: #001018;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover:not(:disabled) { background: var(--accent-hover); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .image-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        border: 1px dashed var(--border);
        border-radius: 8px;
        overflow: hidden;
        min-height: 280px;
        position: relative;
      }
      .image-area img {
        max-width: 100%;
        max-height: 360px;
        object-fit: contain;
      }
      .placeholder, .error {
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 16px;
      }
      .error { color: #f87171; }
      .meta {
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      .meta a { color: var(--accent); text-decoration: none; }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header>
      <h1>Metin & Resim Önerisi</h1>
      <p>Sol tarafa metin yaz, butona bas — GPT-4o-mini metinden arama terimi çıkarır, Google'dan ilk resmi sağda gösteririz.</p>
    </header>
    <main>
      <section class="panel">
        <h2>Metin</h2>
        <textarea
          id="text-input"
          placeholder="Buraya bir şeyler yaz... (örn. 'gün batımında dağ manzarası')"
        ></textarea>
        <button id="suggest-btn" type="button">Resim Öner</button>
      </section>
      <section class="panel">
        <h2>Resim Önerisi</h2>
        <div class="image-area" id="image-area">
          <span class="placeholder">Henüz öneri yok. Butona bas.</span>
        </div>
        <div class="meta" id="meta"></div>
      </section>
    </main>
    <script>
      const btn = document.getElementById("suggest-btn");
      const input = document.getElementById("text-input");
      const area = document.getElementById("image-area");
      const meta = document.getElementById("meta");

      btn.addEventListener("click", async () => {
        const query = input.value.trim();
        if (!query) {
          area.innerHTML = '<span class="error">Önce metin yaz.</span>';
          meta.textContent = "";
          return;
        }
        btn.disabled = true;
        area.innerHTML = '<div class="spinner"></div>';
        meta.textContent = "";
        try {
          const resp = await fetch("/suggest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            area.innerHTML = `<span class="error">${data.error || "Hata oluştu."}</span>`;
            return;
          }
          const img = new Image();
          img.onload = () => {
            area.innerHTML = "";
            area.appendChild(img);
          };
          img.onerror = () => {
            area.innerHTML =
              '<span class="error">Resim yüklenemedi (kaynak engellemiş olabilir).</span>';
          };
          img.alt = data.search_query;
          img.src = data.image;
          meta.innerHTML =
            `<div><strong>Arama terimi:</strong> ${data.search_query}</div>` +
            `<div>Kaynak: <a href="${data.image}" target="_blank" rel="noopener">${data.image}</a></div>`;
        } catch (e) {
          area.innerHTML = `<span class="error">Ağ hatası: ${e.message}</span>`;
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
